<div class="privacy-and-terms">
  <div class="container">
    <h1>{{ page.title }}</h1>
    <h3>Allmyles Ltd.</h3>
    {% if site.data.privacy-and-terms %}
    <p>
      {{ site.data.privacy-and-terms }}
    </p>
    {% endif %}
    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
      <li class="nav-item">
        <a
          class="nav-link active"
          id="pills-privacy-tab"
          data-toggle="pill"
          href="#pills-privacy"
          role="tab"
          aria-controls="pills-privacy"
          aria-selected="true"
        >
          Privacy
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          id="pills-terms-tab"
          data-toggle="pill"
          href="#pills-terms"
          role="tab"
          aria-controls="pills-terms"
          aria-selected="false"
        >
          Terms of services
        </a>
      </li>
    </ul>
    <div class="tab-content" id="pills-tabContent">
      <div
        class="tab-pane fade show active"
        id="pills-privacy"
        role="tabpanel"
        aria-labelledby="pills-privacy-tab"
      >
        {% include privacy.html %}
      </div>
      <div
        class="tab-pane fade"
        id="pills-terms"
        role="tabpanel"
        aria-labelledby="pills-terms-tab"
      >
        {% include terms.html %}
      </div>
    </div>
  </div>
</div>
