<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="index, follow" />
  <link rel="shortcut icon" type="image/x-icon"
    href="{{ '/assets/favicon.ico' | relative_url }}" />
  <link rel="preload"
    href="{{ '/assets/fonts/Aeonik/Aeonik-Regular.otf' | relative_url }}"
    as="font" type="font/otf" crossorigin />
  <link rel="preload"
    href="{{ '/assets/fonts/Aeonik/Aeonik-Bold.otf' | relative_url }}" as="font"
    type="font/otf" crossorigin />
  <link rel="preload"
    href="{{ '/assets/fonts/Aeonik/Aeonik-Light.otf' | relative_url }}"
    as="font" type="font/otf" crossorigin />
  <link rel="preload"
    href="{{ '/assets/fonts/Aeonik/Aeonik-Medium.otf' | relative_url }}"
    as="font" type="font/otf" crossorigin />
  <link rel="stylesheet"
    href="{{ '/assets/css/bootstrap.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="prefetch"
    href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css"
    as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css" />
  </noscript>
  {% seo %}
</head>
