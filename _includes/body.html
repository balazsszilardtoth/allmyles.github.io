<body
  class="{% if page.layout == 'post' %}post{% else %}page page-{{ page.slug }}{% endif %}"
>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-WMV9FM"
      height="0"
      width="0"
      style="display: none; visibility: hidden;"
    ></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->
  <header>
    {% include navbar.html %}
  </header>
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/popper.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/bootstrap.min.js' | relative_url }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.4.1/dist/email.min.js"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
