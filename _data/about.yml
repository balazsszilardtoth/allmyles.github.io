- title: You get what you worked for
  text: As we believe in human creativity we work to completely release you from administrative tasks. Our ghost in the machine communicates, learns, absorbs, transforms, processes and creates a standard application programming interface. We let you easily to connect our Software as a Service (SaaS) with other machines thus creating something bigger, smarter, nicer THING.

- title: Removing manual intervention
  text: Our passion is to bring creativity back to the travel industry by removing manual intervention completely from business administration and let machines do the repetitive job while experienced travel agents, as well as traveler community, can study more about the "product" and tell their stories to everyone online.

- title: Revolutionize industries
  text: Luckily speed of communication gained momentum when a complete generation was born with internet in their DNA. They are already able and ready to learn, improve and utilize open human knowledge available online. They realized that not only humans can share information online but they can pre-program machines too to talk to each other without human interaction. Open communication of machines via the World Wide Web facilitates fresh ideas, innovative minds as well as new businesses to emerge without boundaries.
