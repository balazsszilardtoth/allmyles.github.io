faqs:
  questions:
    - question: How are people using the Allmyles Travel APIs?
      answer: Allmyles Travel APIs are RESTful web services thus completely platform independent stack of travel APIs including Flights APIs, Hotels APIs and CarRental APIs. Our clients find us with a new business model that is unique in the travel industry but may already become a success on other areas. There are travel clubs using our Travel APIs, but it is used for corporate travel websites and it can even be integrated into native applications like one of our biggest customers did it.
    - question: How do Allmyles Travel APIs get all airline, hotel, and car rental prices?
      answer: Behind Allmyles Travel APIs we gather travel content from different sources, but most importantly we consolidate content providers to let our customers keep their travellers on their own website or native application during the full user journey without any redirection to third party websites.
    - question: Can Allmyles Travel APIs provide the connection between my website to Flights, Hotels and Car Rental?
      answer: Yes, these are the main content types Allmyles Travel APIs provide you now, however CarRental is changing these days from a payment perspective, we need to hack the industry to make it work, but you can see CarRentals already in Allmyles Travel APIs offering if you want to test it.
    - question: Can Allmyles Travel APIs connect customers to directly pay through my Web or Native Application? How is this done?
      answer: Yes, Allmyles Travel APIs have a very quick deposit management solution that provides you the flexibility in a Payment Service Provider agnostic way. If you keep a commercial deposit at Allmyles as low as possible we can purchase the travel services from your deposit on behalf of you thus you can integrate any PSP to your front end to collect payment from your end-travelers. 
    - question: Does Allmyles Travel APIs provide my customers with the ability to change / cancel bookings?
      answer: Provided that the change and/or cancellation is permitted for the chosen fare/rate or provider type then yes, we have both a dashboard functionality and an API call to initiate such operations. You need to know that travelers may choose the lowest possible fares from your result list that fares are normally not changeable or cancellable. For Traditional Airlines you can do a VOID transaction if the cancellation request comes the same day when the ticket is issued.
