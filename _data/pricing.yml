faq:
  - question: What is the certification fee for?
    answer: We need to pay licence fees to providers when a new client joins us. Such licence fees are covered from the certification fee.

  - question: Why don’t you show every airlines?
    answer: Staging system has certain limitations in terms of content and flexibility, but staging is not for comparison but for development purposes.

  - question: How do you get all airline, hotel, and car rental prices?
    answer: Allmyles API consolidates the content of different travel providers from GDSs, LowCostContent providers and other hotel and car rental consolidators.
